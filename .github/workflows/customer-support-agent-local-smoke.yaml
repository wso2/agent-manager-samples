name: Customer Support Local Smoke Checks
on:
  pull_request:
    paths:
      - 'customer-support-agent/**'
      - 'test/sample-smoke/local/**'
      - '.github/workflows/customer-support-agent-local-smoke.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: customer-support-agent-local-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    name: Resolve dependencies (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Resolve requirements
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv pip compile customer-support-agent/requirements.txt --python-version "$PYTHON_VERSION" -o /dev/null
  smoke:
    name: Customer Support local smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test model failure guards
        run: python -m unittest discover -s test/sample-smoke/local -p 'test_*.py' -v
      - name: Install or build, start, and test the sample
        env:
          SAMPLE: customer-support-agent
        run: python test/sample-smoke/local/run.py "$SAMPLE" --reports "$RUNNER_TEMP/smoke-reports"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-smoke-customer-support-agent
          path: ${{ runner.temp }}/smoke-reports/
